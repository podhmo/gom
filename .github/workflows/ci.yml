name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only CI: the checks below need nothing more.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `make check` runs the same checks locally.
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # go.mod declares `go 1.27`; setup-go resolves the version file to
      # the latest 1.27.x patch release.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # gofmt is module-agnostic: one pass covers the root module and
      # the nested modules under experiments/.
      # The `exit` on gofmt's own failure also catches unparseable
      # files, which it reports on stderr without listing.
      - name: gofmt -l .
        run: |
          unformatted=$(gofmt -l .) || exit 1
          if [ -n "$unformatted" ]; then
            echo "::error::files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet ./... (root module)
        run: go vet ./...

      - name: go test -race ./... (root module)
        run: go test -race ./...

      # Type-switch exhaustiveness on the //sumtype:decl sealed
      # interfaces (docs/design.md section 2.4). The shared script also
      # asserts the tool still detects the deliberate missing variant
      # in the testdata/sumtype canary module.
      - name: go-check-sumtype (all modules + canary)
        run: sh scripts/check-sumtype.sh

      # staticcheck over every module in the repo (pinned tool version
      # lives in the script, same `go run` pattern as check-sumtype).
      - name: staticcheck (all modules)
        run: sh scripts/check-staticcheck.sh

      # experiments/ hold nested Go modules that `./...` never reaches.
      # Vet and test each module anyway so the verification code does
      # not silently rot. Revisit here — not the root checks — if an
      # experiment ever turns flaky or slow.
      - name: go vet + go test (experiments modules)
        run: |
          test -d experiments || exit 0
          for mod in $(find experiments -name go.mod | sort); do
            dir=$(dirname "$mod")
            echo "== $dir"
            go -C "$dir" vet ./...
            go -C "$dir" test -race ./...
          done

  # Bounded fuzz run (make check-fuzz). Advisory, not a gate: the
  # targets suppress bug classes already registered in knownBugs,
  # but a fresh compiler keeps surfacing NEW classes — a failure
  # here is a finding to file (TODO.md + registry + the corpus file
  # the fuzzer writes under testdata/fuzz/), which is deliberate
  # signal rather than something every green change should block
  # on. See docs/decisions/2026-11-02-fuzz-strategy.md.
  #
  # A failed run files one `fuzz-finding` issue per failure
  # signature (duplicates get a recurrence comment) so findings
  # can't sit unnoticed in a skipped-over advisory log — see
  # docs/decisions/2026-11-04-fuzz-failures-file-issues.md.
  fuzz:
    name: fuzz (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      issues: write # the failure step files fuzz-finding issues
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # tee keeps the output parseable for the issue-filing step;
      # the default -eo pipefail shell still propagates a make
      # failure into the step result.
      - name: make check-fuzz
        run: make check-fuzz 2>&1 | tee check-fuzz.log

      # main pushes only: pull_request tokens are read-only, and
      # one filing channel keeps dedup simple. Non-fatal itself —
      # a filing failure must not turn the advisory red.
      - name: file findings as issues
        if: failure() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: sh scripts/file-fuzz-issues.sh check-fuzz.log
